services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: showings
      POSTGRES_USER: showings
      POSTGRES_PASSWORD: showings
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U showings -d showings"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"

  migrate:
    build:
      context: .
      target: migrator
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://showings:showings@db:5432/showings?schema=public

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://showings:showings@db:5432/showings?schema=public
      APP_URL: http://localhost:3000
      ADMIN_API_KEY: ${ADMIN_API_KEY:-local-admin-key-change-before-production}
      SESSION_SECRET: ${SESSION_SECRET:-local-session-secret-change-before-production-1234}
      OTP_PEPPER: ${OTP_PEPPER:-local-otp-pepper-change-before-production-1234}
      REALTOR_EMAIL: ${REALTOR_EMAIL:-realtor@example.test}
      REALTOR_DISPLAY_NAME: ${REALTOR_DISPLAY_NAME:-Local Realtor}
      REQUIRE_INVITATION_EMAIL_VERIFICATION: ${REQUIRE_INVITATION_EMAIL_VERIFICATION:-false}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      EMAIL_WEBHOOK_URL: ${EMAIL_WEBHOOK_URL:-}
      EMAIL_WEBHOOK_API_KEY: ${EMAIL_WEBHOOK_API_KEY:-}
      CALENDAR_PROVIDER: ${CALENDAR_PROVIDER:-mock}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN:-}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-primary}
      SHOWING_FILTER_MODE: ${SHOWING_FILTER_MODE:-dedicated_calendar}
      SHOWING_EVENT_TYPE: ${SHOWING_EVENT_TYPE:-property_showing}
      SHOWING_TITLE_PREFIX: ${SHOWING_TITLE_PREFIX:-[SHOWING]}
      SHOWING_OPEN_TITLE_PREFIX: ${SHOWING_OPEN_TITLE_PREFIX:-[ABIERTA]}
      SHOWING_CLOSED_TITLE_PREFIX: ${SHOWING_CLOSED_TITLE_PREFIX:-[CERRADA]}
      SHOWING_PUBLIC_BLOCK_START: ${SHOWING_PUBLIC_BLOCK_START:-PUBLIC_SHOWING}
      SHOWING_PUBLIC_BLOCK_END: ${SHOWING_PUBLIC_BLOCK_END:-END_PUBLIC_SHOWING}
    ports:
      - "3000:3000"
    command: ["node", "server.js"]

volumes:
  postgres_data:
